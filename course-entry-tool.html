<div class="ledger">
  <header class="ledger__header">
    <div class="ledger__title">
      <span class="ledger__mark">§</span>
      <div>
        <h1>Course Ledger</h1>
        <p class="ledger__sub">Paste a course's modal text → parse → save. No SQL typing required.</p>
      </div>
    </div>
    <div class="ledger__count" id="count">0 entries</div>
  </header>

  <main class="ledger__body">
    <section class="pane pane--entry">
      <div class="pane__label">01 — Paste</div>
      <textarea id="rawInput" placeholder="Paste the full modal text here, e.g.

CS 101 | Computer Programming and Utilization
Home Page:
http://www.cse.iitb.ac.in/~cs101
Autumn Instructor:
Prof. Abir De
Spring Instructor:
Prof. Vinay J. Ribeiro
Total Credits:
6
Pre-Requisites:
N/A
Duration:
Full Semester
Type:
Theory + Lab
Description :
This course provides an introduction...
References :
Textbook..."></textarea>
      <button class="btn btn--primary" id="parseBtn">Parse →</button>
      <p class="hint" id="parseHint"></p>

      <div class="pane__label pane__label--spaced">02 — Review &amp; edit</div>
      <form id="courseForm" class="form">
        <div class="form__row">
          <label>Course code
            <input type="text" id="f_course_code" placeholder="CS101" class="mono">
          </label>
          <label>Department
            <input type="text" id="f_department" value="CSE">
          </label>
        </div>
        <label>Title
          <input type="text" id="f_title" placeholder="Computer Programming and Utilization">
        </label>
        <div class="form__row">
          <label>Autumn instructor
            <input type="text" id="f_autumn_instructor">
          </label>
          <label>Spring instructor
            <input type="text" id="f_spring_instructor">
          </label>
        </div>
        <div class="form__row form__row--tight">
          <label>Credits
            <input type="text" id="f_credits">
          </label>
          <label>Duration
            <input type="text" id="f_duration">
          </label>
          <label>Type
            <input type="text" id="f_course_type">
          </label>
        </div>
        <div class="form__row">
          <label>Prerequisites
            <input type="text" id="f_prerequisites">
          </label>
          <label>Semester
            <select id="f_semester">
              <option>Autumn</option>
              <option>Spring</option>
              <option>Autumn, Spring</option>
            </select>
          </label>
        </div>
        <label>Home page
          <input type="text" id="f_home_page" class="mono">
        </label>
        <label>Description (syllabus text)
          <textarea id="f_syllabus_text" rows="4"></textarea>
        </label>
        <label>References
          <textarea id="f_references_text" rows="3"></textarea>
        </label>
        <button type="submit" class="btn btn--save">Save entry</button>
        <span class="saved-flash" id="savedFlash">Saved ✓</span>
      </form>
    </section>

    <section class="pane pane--records">
      <div class="pane__label">03 — Saved records</div>
      <div class="export-bar">
        <button class="btn btn--ghost" id="exportSqlBtn">Export as SQL</button>
        <button class="btn btn--ghost" id="exportJsonBtn">Export as JSON</button>
      </div>
      <p class="hint">Entries live in this tab only — export before closing it, or you'll lose your work.</p>
      <div id="recordsList" class="records"></div>
      <textarea id="exportOutput" class="export-output" rows="10" placeholder="Export output will appear here — select all, copy, and paste into your file." readonly></textarea>
    </section>
  </main>
</div>

<style>
:root {
  --paper: #F6F3EC;
  --ink: #241F19;
  --ink-soft: #6B6255;
  --indigo: #33455C;
  --indigo-dark: #24323F;
  --gold: #B8892B;
  --line: #DBD3C1;
  --danger: #9A3B34;
  --card: #FFFDF8;
}

* { box-sizing: border-box; }

body, .ledger {
  font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: transparent;
}

.mono { font-family: "SF Mono", Consolas, Menlo, monospace; }

.ledger {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem;
}

.ledger__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 0.9rem;
  margin-bottom: 1.4rem;
}

.ledger__title { display: flex; gap: 0.7rem; align-items: flex-start; }

.ledger__mark {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 2.1rem;
  color: var(--gold);
  line-height: 1;
  margin-top: 0.1rem;
}

.ledger__title h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.6rem;
  font-weight: 600;
  margin: 0;
  letter-spacing: 0.01em;
}

.ledger__sub {
  margin: 0.2rem 0 0;
  font-size: 0.82rem;
  color: var(--ink-soft);
}

.ledger__count {
  font-family: "SF Mono", Consolas, monospace;
  font-size: 0.78rem;
  color: var(--indigo);
  border: 1px solid var(--indigo);
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  white-space: nowrap;
}

.ledger__body {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 1.6rem;
}
@media (max-width: 820px) {
  .ledger__body { grid-template-columns: 1fr; }
}

.pane__label {
  font-family: "SF Mono", Consolas, monospace;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.5rem;
}
.pane__label--spaced { margin-top: 1.3rem; }

#rawInput {
  width: 100%;
  min-height: 150px;
  font-family: "SF Mono", Consolas, monospace;
  font-size: 0.78rem;
  padding: 0.7rem;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  color: var(--ink);
  resize: vertical;
}

.hint {
  font-size: 0.76rem;
  color: var(--ink-soft);
  min-height: 1.1rem;
  margin: 0.4rem 0 0;
}

.btn {
  font-family: inherit;
  font-size: 0.82rem;
  padding: 0.5rem 1rem;
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  margin-top: 0.6rem;
}
.btn--primary { background: var(--indigo); color: #fff; }
.btn--primary:hover { background: var(--indigo-dark); }
.btn--save { background: var(--gold); color: #241F19; font-weight: 600; }
.btn--save:hover { background: #a37a25; }
.btn--ghost { background: transparent; border: 1px solid var(--indigo); color: var(--indigo); }
.btn--ghost:hover { background: var(--indigo); color: #fff; }
.btn--danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 0.72rem; padding: 0.25rem 0.55rem; }
.btn--danger:hover { background: var(--danger); color: #fff; }

.saved-flash {
  display: inline-block;
  margin-left: 0.7rem;
  font-size: 0.78rem;
  color: #3F7A4E;
  opacity: 0;
  transition: opacity 0.3s;
}
.saved-flash.show { opacity: 1; }

.form { margin-top: 0.5rem; }
.form label {
  display: block;
  font-size: 0.76rem;
  color: var(--ink-soft);
  margin-bottom: 0.55rem;
}
.form input, .form select, .form textarea {
  display: block;
  width: 100%;
  margin-top: 0.25rem;
  padding: 0.4rem 0.5rem;
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--card);
}
.form textarea { resize: vertical; }
.form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.form__row--tight { grid-template-columns: 1fr 1fr 1fr; }

.export-bar { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }

.records {
  max-height: 360px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
}
.record {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.55rem 0.7rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.82rem;
}
.record:last-child { border-bottom: none; }
.record__code {
  font-family: "SF Mono", Consolas, monospace;
  color: var(--indigo);
  font-weight: 600;
  margin-right: 0.6rem;
}
.record__meta { color: var(--ink-soft); font-size: 0.74rem; }
.record__empty { padding: 1rem; color: var(--ink-soft); font-size: 0.82rem; font-style: italic; }

.export-output {
  width: 100%;
  margin-top: 0.9rem;
  font-family: "SF Mono", Consolas, monospace;
  font-size: 0.72rem;
  padding: 0.6rem;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  color: var(--ink);
}
</style>

<script>
const FIELD_LABELS = [
  "Home Page:", "Autumn Instructor:", "Spring Instructor:", "Total Credits:",
  "Pre-Requisites:", "Duration:", "Type:", "Description :", "References :"
];

function parseModalText(text) {
  const positions = [];
  FIELD_LABELS.forEach(label => {
    const idx = text.indexOf(label);
    if (idx !== -1) positions.push([idx, label]);
  });
  positions.sort((a, b) => a[0] - b[0]);

  const fields = {};
  positions.forEach(([idx, label], i) => {
    const start = idx + label.length;
    const end = i + 1 < positions.length ? positions[i + 1][0] : text.length;
    const key = label.replace(/:$/, "").trim();
    fields[key] = text.slice(start, end).trim();
  });

  // Title line is everything before the first label match
  const firstIdx = positions.length ? positions[0][0] : text.length;
  const titleLine = text.slice(0, firstIdx).trim();
  const parts = titleLine.split("|").map(s => s.trim());
  fields["_course_code"] = (parts[0] || "").replace(/\s+/g, "");
  fields["_title"] = parts[1] || "";
  return fields;
}

function fillForm(fields) {
  document.getElementById("f_course_code").value = fields["_course_code"] || "";
  document.getElementById("f_title").value = fields["_title"] || "";
  document.getElementById("f_home_page").value = fields["Home Page"] || "";
  document.getElementById("f_autumn_instructor").value = fields["Autumn Instructor"] || "";
  document.getElementById("f_spring_instructor").value = fields["Spring Instructor"] || "";
  document.getElementById("f_credits").value = fields["Total Credits"] || "";
  document.getElementById("f_prerequisites").value = fields["Pre-Requisites"] || "";
  document.getElementById("f_duration").value = fields["Duration"] || "";
  document.getElementById("f_course_type").value = fields["Type"] || "";
  document.getElementById("f_syllabus_text").value = fields["Description"] || "";
  document.getElementById("f_references_text").value = fields["References"] || "";
}

document.getElementById("parseBtn").addEventListener("click", () => {
  const raw = document.getElementById("rawInput").value.trim();
  const hint = document.getElementById("parseHint");
  if (!raw) { hint.textContent = "Paste something first."; return; }
  try {
    const fields = parseModalText(raw);
    fillForm(fields);
    hint.textContent = fields["_course_code"]
      ? `Parsed ${fields["_course_code"]}. Check the fields below, then save.`
      : "Parsed, but couldn't detect a course code — check the fields manually.";
  } catch (e) {
    hint.textContent = "Couldn't parse that — check the pasted text and try again.";
  }
});

function currentFormRecord() {
  return {
    course_code: document.getElementById("f_course_code").value.trim().toUpperCase(),
    title: document.getElementById("f_title").value.trim(),
    department: document.getElementById("f_department").value.trim(),
    home_page: document.getElementById("f_home_page").value.trim(),
    autumn_instructor: document.getElementById("f_autumn_instructor").value.trim(),
    spring_instructor: document.getElementById("f_spring_instructor").value.trim(),
    semester: document.getElementById("f_semester").value,
    credits: document.getElementById("f_credits").value.trim(),
    prerequisites: document.getElementById("f_prerequisites").value.trim(),
    duration: document.getElementById("f_duration").value.trim(),
    course_type: document.getElementById("f_course_type").value.trim(),
    syllabus_text: document.getElementById("f_syllabus_text").value.trim(),
    references_text: document.getElementById("f_references_text").value.trim(),
    source_url: "https://www.cse.iitb.ac.in/academics/courses",
    last_updated: new Date().toISOString().slice(0, 10)
  };
}

let coursesStore = {}; // in-memory only, keyed by course_code -- no external storage dependency

function loadAllCourses() {
  return Object.values(coursesStore).sort((a, b) => (a.course_code || "").localeCompare(b.course_code || ""));
}

function renderRecords() {
  const list = document.getElementById("recordsList");
  const count = document.getElementById("count");
  const courses = loadAllCourses();
  count.textContent = `${courses.length} entr${courses.length === 1 ? "y" : "ies"}`;

  if (courses.length === 0) {
    list.innerHTML = '<div class="record__empty">Nothing saved yet — parse and save a course to get started.</div>';
    return;
  }

  list.innerHTML = "";
  courses.forEach(c => {
    const row = document.createElement("div");
    row.className = "record";
    row.innerHTML = `
      <div>
        <span class="record__code">${c.course_code}</span>
        <span>${c.title || "(untitled)"}</span>
        <div class="record__meta">${c.semester || ""} · ${c.credits || "?"} credits</div>
      </div>
      <button class="btn btn--danger" data-code="${c.course_code}">Delete</button>
    `;
    row.querySelector("button").addEventListener("click", (e) => {
      const code = e.target.getAttribute("data-code");
      delete coursesStore[code];
      renderRecords();
    });
    list.appendChild(row);
  });
}

document.getElementById("courseForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const record = currentFormRecord();
  if (!record.course_code) {
    alert("Course code is required before saving.");
    return;
  }
  coursesStore[record.course_code] = record;
  const flash = document.getElementById("savedFlash");
  flash.classList.add("show");
  setTimeout(() => flash.classList.remove("show"), 1500);
  renderRecords();
});

function sqlEscape(s) {
  return (s || "").replace(/'/g, "''");
}

document.getElementById("exportSqlBtn").addEventListener("click", () => {
  const courses = loadAllCourses();
  const lines = courses.map(c => `INSERT INTO courses (course_code, title, department, home_page, autumn_instructor, spring_instructor, semester, credits, prerequisites, duration, course_type, syllabus_text, references_text, source_url, last_updated)
VALUES ('${sqlEscape(c.course_code)}', '${sqlEscape(c.title)}', '${sqlEscape(c.department)}', '${sqlEscape(c.home_page)}', '${sqlEscape(c.autumn_instructor)}', '${sqlEscape(c.spring_instructor)}', '${sqlEscape(c.semester)}', ${c.credits ? `'${sqlEscape(c.credits)}'` : "NULL"}, '${sqlEscape(c.prerequisites)}', '${sqlEscape(c.duration)}', '${sqlEscape(c.course_type)}', '${sqlEscape(c.syllabus_text)}', '${sqlEscape(c.references_text)}', '${sqlEscape(c.source_url)}', '${sqlEscape(c.last_updated)}');`);
  document.getElementById("exportOutput").value = lines.join("\n\n") || "-- nothing saved yet";
});

document.getElementById("exportJsonBtn").addEventListener("click", () => {
  const courses = loadAllCourses();
  document.getElementById("exportOutput").value = JSON.stringify(courses, null, 2);
});

renderRecords();
</script>
